<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curly-Cat Bicycles - Official Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        section {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #bgVideo {
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .bg-text {
            color: transparent;
            -webkit-background-clip: text;
            background-image: linear-gradient(45deg, #ff7b00, #ffee00);
            z-index: 10;
            position: relative;
            display: inline-flexbox;
            justify-content: center;
            align-items: center;
            margin: 30px;
        }
        
        .bike > * {
            display: inline-block;
            width: 450px;
            font-size: 20px;
            vertical-align: top;
            margin: 20px;
        }
    </style>
</head>
<body>
    <header id="logo-background">
        <div style="height: 205px; width: 100%; display: flex; align-items: center;">
            <img src="images/Logo.png" height="200px" alt="Logo"/>
            <div style="width: 100px"></div>
            <nav class="inter">
                <ul>
                    <li class="navig"><a href='index.html'>Main</a></li>
                    <li class="navig"><a href='Shop.html'>Shop</a></li>
                    <li class="navig"><a href='#'>Sales</a></li>
                    <li class="navig"><a href='About.html'>About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="null__header-main"></div>

    <main class="checkout-container">
        <h1 class="gradient-h1 inter">Order Confirmation</h1>

        <form action="#" method="POST" class="checkout-form">
            
            <fieldset class="form-section">
                <legend class="inter gradient-orange">Personal Info</legend>
                
                <div class="form-group">
                    <label class="inter gradient-white" for="name">Your name</label>
                    <input type="text" name="name" id="name" placeholder="Firstname Surname" required>
                </div>

                <div class="form-group">
                    <label class="inter gradient-white" for="email">E-mail</label>
                    <input name="email" type="email" id="email" placeholder="Your E-mail" required>
                </div>

                <div class="form-group">
                    <label class="inter gradient-white" for="address">Your address</label>
                    <input type="text" name="address" id="address" placeholder="Address" required>
                </div>

                <div class="form-group">
                    <label class="inter gradient-white" for="date">Delivery date</label>    
                    <input type="date" name="date" id="date" required>
                </div>
            </fieldset>

            <fieldset class="form-section delivery">
                <legend class="inter gradient-orange">Delivery Options</legend>
                
                <h3 class="delivery__title inter gradient-yellow">Choose delivery way</h3>
                <div class="option-group">
                    <label class="inter gradient-white" for="courier">
                        <input name="delivery" type="radio" value="courier" id="courier" checked> Courier
                    </label>
                    <label class="inter gradient-white" for="sam">
                        <input name="delivery" type="radio" value="pickup" id="sam"> From hands
                    </label>
                    <label class="inter gradient-white" for="mail">
                        <input name="delivery" type="radio" value="post" id="mail"> Post
                    </label>
                </div>

                <h3 class="delivery__title inter gradient-yellow">Extra services</h3>
                <div class="option-group">
                    <label class="inter gradient-white" for="dop1">
                        <input type="checkbox" name="dop1" id="dop1"> Fast delivery
                    </label>
                    <label class="inter gradient-white" for="dop2">
                        <input type="checkbox" name="dop2" id="dop2"> Loader
                    </label>
                    <label class="inter gradient-white" for="dop3">
                        <input type="checkbox" name="dop3" id="dop3"> Armor-piercing box
                    </label>
                </div>
            </fieldset>

            <fieldset class="form-section select">
                <legend class="inter gradient-orange">Payment & Comment</legend>
                
                <div class="form-group">
                    <label class="inter gradient-white" for="payment">Payment method</label>
                    <select name="money" id="payment">
                        <option value="online">Online</option>
                        <option value="cash">Cash</option>
                        <option value="card">Card</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="inter gradient-white" for="comment">Additional comment</label>
                    <textarea name="comment" id="comment" cols="30" rows="5" placeholder="Your comment"></textarea>
                </div>
            </fieldset>

            <button class="buy-button inter" type="submit">Complete Order</button>
        </form>
    </main>

    <footer>
        <div class="footer">
            <h1 class="footer-gradient inter">©Curly-Cat Bicycles</h1>
        </div>
    </footer>
</body>
</html>
